  - id: video.retention_edit.guided
    description: >
      Guided start of an EditAi short-form video edit for any niche (clinic, restaurant,
      course or class, e-commerce product, real estate, personal brand, wellness
      UGC): greets a first-time person with a short welcome (what the squad
      does, reference videos, the mini editor) when the project has no history,
      reads the video, text or audio transcript the person sent, asks only
      the missing multiple-choice questions (destination, format, mood, reference,
      captions and headline; 0 to 5, always with an other option, as clickable
      AskUserQuestion on Claude Code or a numbered list elsewhere), suggests the
      edit plan (template, cut pace, caption and headline style, library music by
      mood, sound effects) and asks for a go-ahead, saves the answers as a client
      profile in the user's project ("same style as last time?" next time), starts
      from generic niche profiles, then renders with the retention engine, the
      measured QA and the mini editor.
    domains: [video, content, social_media, media]
    inputs:
      - name: material
        type: array
        required: true
        description: the clips, photos or screen recordings the person sent
      - name: message
        type: string
        required: false
        description: what the person wrote, or the transcript of an audio message
      - name: client
        type: string
        required: true
        description: client or project name; the profile is saved per client in the user's project
      - name: reference
        type: string
        required: false
        description: reference video file or link whose editing style should be copied
    outputs:
      - name: edit_plan
        type: file
        format: markdown
        description: plan.md with the suggested edit, ending in "Posso editar?"
      - name: client_profile
        type: file
        format: json
        description: editai/profiles/<client>.json in the user's project
      - name: edited_mp4
        type: file
        format: mp4
        description: the styled edit with spec and QA report
    tools_required: [read, write, bash]
    invoke: { type: workflow, ref: workflows/guided-edit }

    - edit-qa-auditor.md
    - edit-briefing-guide.md
    - video-intent-archaeologist.md
    - video-director.md
    - character-consistency-keeper.md
    - tool-router.md
    - prompt-architect.md
    - video-generator.md
    - lipsync-specialist.md

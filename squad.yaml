  - id: video.retention_edit.review
    description: >
      Opens an already rendered retention edit in the EditAi mini editor in the
      browser (127.0.0.1 only, per-run token, Portuguese interface). The Editor
      tab draws the headline and the captions over a clean base video, so a new
      headline text, mode or size, caption style, corrected word or yellow
      keyword shows at once; a quick-preview button renders a 540x960 draft,
      approve picks the video in the player, and finalize renders the 1080x1920
      final with the full QA and copies it to Downloads; undo and a version list
      go back. The timeline tab is like a light CapCut-style editor: video player, timeline with audio waveform and frame
      strip, the spec's takes, headline, music, whoosh markers and caption groups
      as blocks. The person marks stretches with in and out points and a free note,
      drags a take edge to extend or shorten it from the original clip, switches
      captions between bold-word and classic, the headline between fixed and intro
      and edits its text, turns music on or off and changes its gain, turns whoosh
      on or off, corrects a caption word and approves. Everything is saved to a
      versioned feedback.json next to the spec. apply-feedback then applies the
      deterministic changes without AI (style, gain, toggles, caption text, ripple
      take trims), writes the next spec version, re-renders with the measured QA
      and lists the free-text marks in pending-notes.md for the retention editor.
    domains: [video, media, content]
    inputs:
      - name: edit_spec
        type: file
        required: true
        description: resolved edit spec JSON of the rendered MP4 (the MP4 sits next to it or is passed with --video)
    outputs:
      - name: feedback
        type: file
        format: json
        description: versioned feedback.json with marks, take trims, style, caption fixes and approval
      - name: next_version
        type: file
        format: mp4
        description: next spec version, its MP4 and QA report after apply-feedback
      - name: pending_notes
        type: file
        format: markdown
        description: pending-notes.md with the free-text marks and the choices left to the editor
    tools_required: [read, write, bash]
    invoke: { type: workflow, ref: workflows/retention-review }
    examples:

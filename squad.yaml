runtime_requirements:
  policy: active
  minimum:
    - { runtime: claude-code, version: ">=1.0.0" }
  compatible:
    - { runtime: codex, version: ">=0.20.0" }
    - { runtime: gemini-cli, version: ">=0.4.0" }
  incompatible: []

features_required:
  - file_write
  - max_turns
  - handoff_artifacts
features_optional:
  - web_search
  - web_fetch

output:
  base_dir: default

capabilities:
  - id: video.retention_edit.execute
    description: >
      EditAi edits existing clips, photos or screen recordings into a retention-paced
      9:16 MP4: chooses the format template (text-only hook, POV with app screen,
      this-vs-that split screen, talking head with bold word-by-word captions and
      a fixed headline), places cataloged edit hooks on a timeline (impact zoom,
      slow push, punch-in cut, hard cut, smooth take cut with J-cut, audio
      crossfade and alternating punch-in, pattern break, animated text entrance,
      speed ramp, B-roll overlay, whoosh, hit, riser, silence before the turn,
      music drop, background music ducked under the voice), writes the JSON
      edit spec, renders it with ffmpeg and libass, and runs a measured QA:
      text bounding box against Reels, TikTok, Shorts and Facebook Reels safe
      zones, font size floor, dwell time, eyes and mouth kept clear, -14 LUFS and
      -1 dBTP, H.264 1080x1920 at 30 fps.
    domains: [video, media, social_media, content]
    inputs:
      - name: material
        type: array
        required: true
        description: clip, photo or screen-recording paths
      - name: script_or_hook
        type: string
        required: true
        description: on-screen hook text, script or transcript with word timings
      - name: platforms
        type: array
        required: false
        description: instagram_reels, tiktok, youtube_shorts, facebook_reels (default the first two)
      - name: review
        type: boolean
        required: false
        description: true opens the local browser preview after the QA for a human review, then applies the feedback (workflow steps review and apply-feedback)
    outputs:
      - name: edited_mp4
        type: file
        format: mp4
        description: 9:16 1080x1920 H.264 30 fps MP4 plus a PNG frame
      - name: edit_spec
        type: file
        format: json
        description: resolved edit spec that produced the MP4 (re-renderable)
      - name: qa_report
        type: file
        format: markdown
        description: measured QA with verdict PASS, CONCERNS or FAIL
    tools_required: [read, write, bash]
    invoke: { type: workflow, ref: workflows/retention-edit }

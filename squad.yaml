  - id: video.reference_style.extract
    description: >
      EditAi copies the editing style of a reference reel or short onto the person's own
      footage. Takes a local file, a TikTok or YouTube link (yt-dlp) or an
      Instagram link (only with an Apify token); measures cut pace, zoom at cuts,
      text and caption position, size and case, fixed headline, sound effects at
      the turns, music presence and level, palette and framing with editonny's
      measure_reference helper; saves a style profile JSON in the user's project
      with an honest list of what the engine cannot reproduce; applies it with a
      quick draft, the final with measured QA and the mini editor. Copies editing
      language only, never the speech, music, brand or people of the reference.
    domains: [video, media, content]
    inputs:
      - name: reference
        type: string
        required: true
        description: reference video file, TikTok or YouTube link, or Instagram link with APIFY_TOKEN set
      - name: material
        type: array
        required: false
        description: the person's own takes to apply the style to
    outputs:
      - name: style_profile
        type: file
        format: json
        description: editai/styles/<name>.style.json plus the .style.md report in the user's project
      - name: edited_mp4
        type: file
        format: mp4
        description: draft, final MP4, spec and QA report with the style applied
    tools_required: [read, write, bash]
    invoke: { type: workflow, ref: workflows/reference-style }
    examples:

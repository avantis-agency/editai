  - id: video.video_creation_pipeline.execute
    description: >
      Produces an AI-generated MP4 and edits it for retention in one run: declares
      duration, platform and aspect as premises, writes script and shot-list.csv
      with durations snapped to the live engine's legal lengths, routes each shot
      after probing Grok Imagine, Veo, Kling, Higgsfield, Runway or Luma, generates
      clips with last-frame to first-frame continuity, lipsyncs when needed, mixes
      audio, concats with ffmpeg, then hands the master to the EditAi retention edit pass
      and its measured QA.
    domains: [video, media, content]
    invoke: { type: workflow, ref: workflows/video-creation-pipeline }
    examples:
      - gere os clipes com IA e já entregue o reel editado com cortes, legenda animada e efeitos sonoros
      - generate an AI video from this idea and finish it with retention editing
      - do roteiro ao vídeo editado para retenção, com ganchos visuais
    produces: [retention-edit-mp4, video-mp4-9x16, edit-decision-list, video-storyboard]
    outputs:
      - name: master_mp4
        type: file
        format: mp4
        description: outputs/master.mp4 and outputs/master-edited.mp4
      - name: audit_report
        type: file
        format: markdown
        description: generation audit plus edit QA report
    acceptance:
      - id: pipeline_master_exists
        description: outputs/master.mp4 exists and ffprobe reports a video stream
        blocking: true
      - id: pipeline_shot_durations_legal
        description: every shot duration_sec is a legal length for its routed engine
        blocking: true
      - id: pipeline_routing_probed
        description: routing-plan.yaml records a probe result and a fallback per shot
        blocking: true
      - id: pipeline_retention_pass
        description: outputs/master-edited.mp4 exists with its edit spec and a QA report that is not FAIL, unless the brief declared the edit pass off
        blocking: true
    example_briefs:
      - Gera os clipes com IA desse roteiro e já me entrega o reel final editado
      - Generate the AI shots for this script with Veo or Kling and deliver the final reel already edited
      - quero o vídeo gerado por IA a partir da ideia e já editado, pronto pra postar
    keywords:
      - gerado por IA e editado
      - ai generated and edited
      - clipes com IA editados
      - geração mais edição
      - geracao mais edicao
      - veo
      - kling
      - grok imagine
      - higgsfield
    not_for:
      - live streaming
      - transmissão ao vivo
      - real-time avatar
    fidelity:
      status: experimental
    score_boost: 0.9

  - id: video.long_form_multi_shot.execute

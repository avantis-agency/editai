      last-frame to first-frame conditioning on dual-keyframe engines (Kling,
      Higgsfield Seedance, Veo first-last, Luma Ray), refuses joins whose face drift
      misses the threshold, and finishes with the EditAi retention edit pass and its
      measured QA.

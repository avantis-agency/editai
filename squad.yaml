  - id: video.lipsync_refinement.execute
    description: >
      Re-syncs lips on existing footage to a new voice track with the live Sync.so
      model, Hedra or a local tool, keeps the source resolution, measures LSE
      against the declared tier, and then burns word-by-word captions with the
      active word highlighted and the EditAi retention edit pass, so a dubbed clip leaves
      ready for Reels, TikTok or Shorts.
    domains: [video, media, audio]
    invoke: { type: workflow, ref: workflows/lipsync-refinement }
    examples:
      - dubla este vídeo em inglês, sincroniza os lábios e coloca legenda palavra por palavra
      - lipsync this dubbed clip and burn animated word captions for Reels
    produces: [retention-edit-mp4, video-mp4-9x16, video-mp4-16x9]
    outputs:
      - name: lipsynced_mp4
        type: file
        format: mp4
        description: lipsynced footage plus the captioned, retention-edited version
    acceptance:
      - id: lipsync_source_kept
        description: lipsynced output width and height equal the source video
        blocking: true
      - id: lipsync_lse_within_tier
        description: measured LSE is at or below the brief's tier threshold
        blocking: true

    - plan-text-hook-batch.md
    - render-edit-spec.md
    - audit-retention-edit.md
    - review-edit-preview.md
    - serve-editor-requests.md
    - apply-edit-feedback.md
    - run-edit-briefing.md
    - extract-reference-style.md
    - apply-reference-style.md
    - interview-video-intent.md
    - direct-video.md
    - build-shot-list.md
    - create-character-bible.md
    - plan-character-lora.md
    - route-video-tool.md

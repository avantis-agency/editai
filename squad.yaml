  - id: video.text_hook_batch.execute
    description: >
      EditAi renders a batch of short text-on-screen hook videos (no speech) from a list of
      hooks and one photo or clip per item: fills the text-only template with the
      exact hook lines, a staggered text entrance, slow push, impact zoom with a
      hit and a whoosh, fits the text inside Reels and TikTok safe zones and away
      from the eyes and mouth, renders the items in parallel with ffmpeg and writes
      per video the MP4, the edit spec, a PNG frame and a measured QA report, plus
      a batch report. The text is compared verbatim with the source note.
    domains: [video, social_media, content, media]
    inputs:
      - name: hooks
        type: array
        required: true
        description: exact hook lines per item, with the path of the note they came from
      - name: base_media
        type: array
        required: true
        description: one photo or clip per item (or a default for all)
    outputs:
      - name: videos
        type: file
        format: mp4

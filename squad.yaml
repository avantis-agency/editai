name: editai
version: 2.0.0
protocol: "6.0"
description: >
  EditAi (a play on "edita aí" and "Edit AI").
  Renders retention-edited short-form MP4s (9:16, 1080x1920, H.264, 30 fps) from
  footage, photos or screen recordings: picks a format template (text-only hook,
  POV with app screen, this-vs-that split screen, talking head with word captions),
  applies cataloged edit hooks (impact zoom, slow push, punch-in cut, hard cut,
  smooth take cut with J-cut and audio crossfade, pattern break, animated text,
  bold-word captions, fixed headline, speed ramp, B-roll, whoosh, hit, riser,
  music ducked under the voice, silence before the turn), writes a JSON edit
  spec, renders it with ffmpeg and libass, and
  measures the result: platform safe zones on the real text bounding box, text
  size and dwell time, loudness at -14 LUFS, codec and frame rate. Ships a CC0
  music (by mood) and sound-effect starter kit with per-item licenses and pulls
  the rest of the library on demand into a cache outside the squad, renders the
  same bytes from the same spec, batches text-on-screen hooks and talking heads,
  opens a local mini editor to change the headline and captions live, render a
  quick draft and finalize with QA, takes edit requests typed in plain words in
  that editor (quick commands applied by the engine, the rest served by the
  person's own Claude Code or Codex agent through a closed set of validated
  operations, no paid API) over a four-track timeline, runs a short guided briefing for any niche
  (0 to 5 clickable questions, a suggested plan, a saved profile per client),
  copies the editing style of a reference video into a style profile it applies,
  builds an optional Concat project to adjust by hand, and keeps the AI clip generation pipelines of
  nirvana-video-creator 6.0.0, each ending in the same retention edit pass.
author: christopher.techuser
license: SUL-1.0
derived_from:
  squad: nirvana-video-creator
  version: 6.0.0
  author: Luiz Gustavo Vieira Rodrigues <@gutomec>
  date: "2026-10-17"
  note: internal white-label derivative; the original is untouched
slashPrefix: editai
# squads.sh / AIOS manifest block (additive). Nirvana reads protocol, capabilities and
# runtime_requirements; squads.sh reads aios. config/ exists for squads.sh but is not
# listed under components, which Nirvana keeps to agents, tasks, workflows and schemas.
aios:
  minVersion: "2.1.0"
  type: squad
tags:

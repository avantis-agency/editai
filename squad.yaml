  - id: video.retention_edit.live
    description: >
      AI request box inside the EditAi mini editor of a rendered short-form edit
      (editor com IA): the person plays the video, moves the cursor or selects a
      stretch on a four-track timeline (video thumbnails, caption blocks, edit
      track with headline, zooms, punch-ins and sound effects, audio waveform with
      the music bar) and types what to change in plain words ("tira essa pausa",
      "music lower", "zoom here"). Quick commands are resolved by the engine at
      once (remove the pause at the cursor, cut the selection, caption and headline
      size, style and position, replace or highlight a caption word, music level
      and on or off, whoosh, zoom, undo). Free requests wait in a queue served by
      the person's own Claude Code or Codex agent with agent-inbox, edit-op (a
      closed, validated set of operations, no path and no shell) and agent-reply,
      with no paid API key. Each request renders a quick draft, shows its status
      (queued, applying, done, needs you, failed) and has its own undo; the person
      approves and finalizes with the full QA.
    domains: [video, media, content]
    inputs:
      - name: edit_spec
        type: file
        required: true
        description: resolved edit spec JSON of the rendered MP4 (the mini editor opens on it)
    outputs:
      - name: requests
        type: file
        format: json
        description: <id>.requests.json with every request, its status and the answer
      - name: feedback
        type: file
        format: json
        description: feedback.json with the operations of each request, tagged with its id
      - name: drafts_and_final
        type: file
        format: mp4
        description: quick drafts after each request and the final with QA copied to Downloads
    tools_required: [read, write, bash]
    invoke: { type: workflow, ref: workflows/live-edit }
    examples:

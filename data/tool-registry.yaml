# Video AI Tool Registry
# Canonical inventory of FAMILIES consumed by tool-router.
# Internal ids (veo-3-1, kling-3-0, …) are this squad's routing keys, not vendor catalog.
# Durations, prices, model codes: resolve this run. Dated snapshot: references/state-of-the-art.md.
# Live card wins. Do not copy SOTA numbers back into agents.

version: "2.0.0"

# Categories: t2v (text-to-video), i2v (image-to-video), lipsync, avatar, orchestration, post-processing, audio

tools:
  # ========== CLOUD T2V/I2V NATIVE ==========
  - id: veo-3-1
    name: "Veo"
    vendor: "Google"
    category: t2v
    api_available: true
    api_provider: "Gemini API / Vertex"
    strengths:
      - "Native dialogue + SFX generation"
      - "Prompt adherence"
      - "Last-frame, scene extension, reference images (confirm on the live Veo page)"
    when_to_use:
      - "Dialogue-heavy scenes (English primary)"
      - "Photorealistic broadcast-quality"
      - "When prompt adherence is critical"
    duration_resolve: "Live Veo card this run. House default 8 s when the brief is silent and the card still allows it."
    auth: "GOOGLE_API_KEY or GEMINI_API_KEY"
    gpu_required: false

  - id: grok-imagine
    name: "Grok Imagine"
    vendor: "xAI"
    category: t2v
    api_available: true
    api_provider: "Grok CLI (subscription) or Imagine API"
    strengths:
      - "Native audio always on (speech in quotes)"
      - "CLI and API durations from grok --help / doctor this run"
      - "Extend and edit endpoints on the credit rail"
    when_to_use:
      - "Default when grok is on PATH"
      - "Talking-head with included audio"
    duration_resolve: "grok --help / doctor this run. House default CLI 6 or 10 s when the brief is silent and the help still lists them."
    auth: "grok on PATH or XAI_API_KEY"
    gpu_required: false

  - id: sora-2-pro
    name: "Sora"
    vendor: "OpenAI"
    category: t2v
    api_available: false
    api_provider: "OpenAI Videos API. Confirm https://developers.openai.com/api/docs/guides/video-generation this run. Never primary."
    strengths:
      - "Synced audio (historical)"
    when_to_use:
      - "Only when OPENAI_API_KEY is set AND every other live engine failed AND the Videos API page still lists a callable model"
    duration_resolve: "Live Videos API page this run. If unlisted, drop from the live set."
    auth: "OPENAI_API_KEY"
    gpu_required: false

  - id: runway-gen-4
    name: "Runway"
    vendor: "Runway"
    category: t2v
    api_available: true
    api_provider: "Runway REST API. Live model id from the account dashboard this run."
    strengths:
      - "Reference-conditioned I2V"
      - "Camera / 3D control"
    when_to_use:
      - "Reference-conditioned I2V"
      - "When RUNWAY_API_KEY is live"
    duration_resolve: "Live Runway card this run. Do not treat a 60 s SKU as the one-shot default."
    auth: "RUNWAY_API_KEY"
    gpu_required: false

  - id: kling-3-0
    name: "Kling"
    vendor: "Kuaishou"
    category: t2v
    api_available: true
    api_provider: "Kling API / FAL.ai. Live fal id this run."
    strengths:
      - "Native audio, multi-shot, first/last frame when the live schema lists them"
      - "Element references, multilingual"
    when_to_use:
      - "Continuity_chain dual-keyframe"
      - "Shots longer than the live Veo one-shot"
      - "Native audio outside English"
    duration_resolve: "Live fal / Kling card this run."
    auth: "FAL_KEY or KLING_API_KEY"
    gpu_required: false
  - id: kling-2-6-pro
    name: "Kling previous generation (legacy fallback)"
    vendor: "Kuaishou"
    category: t2v
    api_available: true
    api_provider: "FAL.ai"
    strengths:
      - "Native A/V, first/last on some SKUs"
    when_to_use:
      - "Fallback when the current Kling generation is unavailable on fal this run"
    duration_resolve: "Live fal id this run. Prefer the current Kling generation first."
    auth: "FAL_KEY"
    gpu_required: false

  - id: luma-ray-2
    name: "Luma Ray"
    vendor: "Luma AI"
    category: i2v
    api_available: true
    api_provider: "FAL.ai or Luma API. Live id this run."
    strengths:
      - "3D-aware camera movements"
      - "Object-centric motion"
      - "Keyframe interpolation (frame0+frame1)"
      - "Realistic motion physics"
    when_to_use:
      - "Product shots with camera orbits"
      - "Smooth shot-to-shot transitions"
      - "Image-to-video from still frames"
    duration_resolve: "Live fal / Luma card this run."
    auth: "FAL_KEY or LUMA_API_KEY"
    gpu_required: false

  - id: higgsfield
    name: "Higgsfield (Soul ID / Seedance / Marketing Studio)"
    vendor: "Higgsfield"
    category: t2v-i2v
    api_available: true
    api_provider: "@higgsfield/cli (shell-out). Ids from `higgsfield model list` this run."
    strengths:
      - "Soul ID — identidade de personagem/produto travada entre gerações (consistência forte)"
      - "Seedance keyframe-chaining (start_image/end_image → jornada contínua)"
      - "Marketing Studio — UGC/product ad falado direto, Click-to-Ad por URL"
      - "Upscale Topaz 4K/8K when listed"
    when_to_use:
      - "Personagem/produto consistente entre tomadas (hero-image + Soul ID)"
      - "Jornada encadeada que varre como tomada única (Seedance)"
      - "Anúncio UGC / product ad vertical"
    duration_resolve: "higgsfield model get <id> this run."
    audio: "per-destination (--generate_audio false=hero/loop, true=publicar)"
    auth: "higgsfield auth login (OAuth) ou HF_KEY"
    gpu_required: false
    reference: "lib/video-fundamentals/higgsfield-cli.md"

  # ========== OSS T2V/I2V (SELF-HOSTED) ==========
  - id: wan-2-2
    name: "Wan"
    vendor: "Alibaba"
    category: t2v-i2v
    api_available: false
    strengths:
      - "MoE architecture"
      - "Apache 2.0 license"
      - "MoE; FLF2V when the installed checkpoint exposes it"
      - "Bilingual (EN/ZH)"
    when_to_use:
      - "Long-form consistency via FLF2V"
      - "Open-source control workflows"
      - "Local GPU rendering"
    duration_resolve: "ComfyUI /object_info this run. Never download weights."
    min_vram_gb_floor: 12
    framework: "ComfyUI (WanVideoWrapper by kijai)"
    cost_tier: free
    gpu_required: true


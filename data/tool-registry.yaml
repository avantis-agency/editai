# Decision routing summary
# Fundamentos transversais (hero-image, chaining, áudio, crédito): lib/video-fundamentals/
routing_priorities:
  need_dialogue_english: [veo-3-1, grok-imagine]
  need_dialogue_multilingual: [hedra-character-3, synthesia]
  need_photorealism_premium: [veo-3-1, kling-3-0]
  need_emotional_expressivity: [veo-3-1, grok-imagine]
  need_motion_control: [runway-gen-4, kling-3-0]
  need_budget_iteration: [kling-3-0, grok-imagine, ltx-2-3]
  need_local_gpu_only: [wan-2-2, hunyuan-video, ltx-2-3]
  need_keyframe_chaining: [higgsfield, luma-ray-2, kling-3-0, wan-2-2]
  need_consistent_character: [higgsfield, runway-gen-4]
  need_ugc_ad: [higgsfield]
  need_lipsync_broadcast: [sync-so-lipsync-2-pro]
  need_lipsync_local: [latentsync-1-6, musetalk-1-5, wav2lip]
  need_avatar_from_photo: [omnihuman-1-5, hedra-character-3]
  need_upscale: [higgsfield, supir, topaz-video-ai]
